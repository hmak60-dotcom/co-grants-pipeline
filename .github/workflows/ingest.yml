name: Grants Pipeline Ingestion

on:
  schedule:
    # Runs daily at 9am UTC (~2am MT). Adjust as you like.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # lets you trigger manually from the Actions tab too

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDID_API_KEY: ${{ secrets.CANDID_API_KEY }}
          CDE_DISTRICT_DIRECTORY_URL: ${{ secrets.CDE_DISTRICT_DIRECTORY_URL }}
        run: node ingest/index.js --source=all

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cde-debug-screenshot
          path: ingest/_debug_cde_forecast.png
          if-no-files-found: ignore
